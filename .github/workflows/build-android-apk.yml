name: Build Custom Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "App variant (preview installs side-by-side cleanly)"
        type: choice
        default: preview
        options:
          - preview
          - production
      architectures:
        description: "Target Android ABIs (arm64-v8a covers modern Android 12+ phones and builds 2x faster)"
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a,arm64-v8a
      enable_t3_connect:
        description: "Copy .env.example to .env so T3 Connect works out of the box"
        type: boolean
        default: true
  push:
    branches:
      - feat/android-ios-glass-ui
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "patches/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-custom-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: ${{ inputs.variant || 'preview' }}
      ORG_GRADLE_PROJECT_reactNativeArchitectures: ${{ inputs.architectures || 'arm64-v8a' }}
      ENABLE_T3_CONNECT: ${{ (github.event_name != 'workflow_dispatch' || inputs.enable_t3_connect) && 'true' || 'false' }}
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      NODE_OPTIONS: --max-old-space-size=8192
      EXPO_NO_GIT_STATUS: "1"
      CCACHE_DIR: /home/runner/.cache/ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CI: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle /opt/ghc || true
          df -h

      - name: Install ccache
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=2G
          ccache --zero-stats

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: custom-apk-ccache-${{ runner.os }}-${{ env.ORG_GRADLE_PROJECT_reactNativeArchitectures }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            custom-apk-ccache-${{ runner.os }}-${{ env.ORG_GRADLE_PROJECT_reactNativeArchitectures }}-
            custom-apk-ccache-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Enable Corepack and pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "store_path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: custom-apk-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: |
            custom-apk-pnpm-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: custom-apk-gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package.json', 'apps/mobile/app.config.ts', 'pnpm-lock.yaml') }}
          restore-keys: |
            custom-apk-gradle-${{ runner.os }}-

      - name: Install mobile workspace dependencies
        run: pnpm install --frozen-lockfile --filter=@t3tools/mobile...

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls -la "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" || true

      - name: Configure public T3 Connect env
        if: env.ENABLE_T3_CONNECT == 'true'
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
            echo "Copied .env.example -> .env"
          fi

      - name: Run Expo prebuild for Android
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild --clean --platform android --no-install
          grep -n "signingConfig" android/app/build.gradle || true

      - name: Compile standalone Release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease \
            --build-cache \
            --no-daemon \
            --max-workers=4
          ccache --show-stats || true

      - name: Prepare APK artifact
        id: apk
        run: |
          APK_SRC="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Release APK not found at $APK_SRC"
            find apps/mobile/android/app/build/outputs -maxdepth 4 || true
            exit 1
          fi
          APK_NAME="rias-code-android-${APP_VARIANT}-${ORG_GRADLE_PROJECT_reactNativeArchitectures//,/-}.apk"
          cp "$APK_SRC" "$RUNNER_TEMP/$APK_NAME"
          ls -lh "$RUNNER_TEMP/$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish direct-download prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          TAG="android-ios-glass-latest"
          TITLE="Rias Code Android — Liquid Glass (${APP_VARIANT})"
          NOTES="Custom Rias Code Android build (Liquid Glass UI + 165Hz optimizations) from commit \`${GITHUB_SHA::7}\` (\`${APP_VARIANT}\`, \`${ORG_GRADLE_PROJECT_reactNativeArchitectures}\`). Tap the APK asset below on your phone to download and install."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "$GITHUB_REF_NAME"
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" --title "$TITLE" --notes "$NOTES" --prerelease --target "$GITHUB_REF_NAME"
          fi
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          echo "### Direct APK download" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download ${APK_NAME}](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
